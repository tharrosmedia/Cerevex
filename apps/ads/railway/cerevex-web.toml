# cerevex-web — dashboard start/build after apps/os→ads rename (PR #10).
# Notes only. Do not set railwayConfigFile. Do not place this at repo root.
# Stale (do not use): npm run build --workspace=@tharros/web
# Stale path (do not use): cd apps/os/web
# Package start binds 127.0.0.1:43181 — Railway must use the command below.

[build]
builder = "RAILPACK"
buildCommand = "npm install && npm run build --workspace=@tharros/ads-web"

[deploy]
startCommand = "cd apps/ads/web && npx next start --hostname 0.0.0.0 --port $PORT"
