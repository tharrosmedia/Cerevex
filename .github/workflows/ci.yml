name: CI

on:
  pull_request:
    # `edited` covers a PR retargeted onto main. Other jobs skip that action.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

jobs:
  changes:
    name: path filter
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    outputs:
      brain: ${{ steps.filter.outputs.brain }}
      ads: ${{ steps.filter.outputs.ads }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            brain:
              - 'apps/brain/**'
              - 'jobs/seo/**'
              - 'packages/contracts/**'
              - 'packages/db/**'
              - 'packages/shared/**'
              - 'packages/skills/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            ads:
              - 'apps/ads/**'
              - 'jobs/ads/**'
              - 'jobs/meta/**'
              - 'jobs/google/**'
              - 'packages/contracts/**'
              - 'packages/skills/**'

  brain:
    name: apps/brain + jobs/seo
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.brain == 'true'
        with:
          node-version: "22"
          cache: npm
      - name: Install
        if: needs.changes.outputs.brain == 'true'
        run: npm ci
      - name: Typecheck Brain
        if: needs.changes.outputs.brain == 'true'
        run: npm run typecheck --workspace=@cerevex/brain
      - name: Typecheck jobs/seo
        if: needs.changes.outputs.brain == 'true'
        run: npm run typecheck --workspace=@cerevex/jobs-seo
      - name: Typecheck contracts
        if: needs.changes.outputs.brain == 'true'
        run: npm run typecheck --workspace=@cerevex/contracts
      - name: Typecheck and test skills package
        if: needs.changes.outputs.brain == 'true'
        run: |
          npm run typecheck --workspace=@cerevex/skills
          npm run test --workspace=@cerevex/skills
      - name: Test Brain
        if: needs.changes.outputs.brain == 'true'
        run: npm run test --workspace=@cerevex/brain
      - name: Build Brain
        if: needs.changes.outputs.brain == 'true'
        env:
          ENCRYPTION_KEY: ci-encryption-key-no-whitespace
          APP_PASSWORD: ci-app-password
          ADS_INTERNAL_KEY: ci-internal-key
          GSC_OAUTH_STATE_SECRET: ci-gsc-state-secret
          SENTRY_AUTH_TOKEN: ""
        run: npm run build --workspace=@cerevex/brain
      - name: Smoke Brain
        if: needs.changes.outputs.brain == 'true'
        env:
          ENCRYPTION_KEY: ci-encryption-key-no-whitespace
          APP_PASSWORD: ci-app-password
          ADS_INTERNAL_KEY: ci-internal-key
          GSC_OAUTH_STATE_SECRET: ci-gsc-state-secret
          PORT: "3310"
        run: |
          set -euo pipefail
          # setsid makes npm the process-group leader so cleanup stops next-server, not only npm.
          setsid npm run start --workspace=@cerevex/brain > /tmp/brain-start.log 2>&1 &
          pid=$!
          cleanup() {
            kill -TERM -"$pid" 2>/dev/null || true
            sleep 1
            kill -KILL -"$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:3310/api/health; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = "1"
          code_of() {
            curl -s -o /dev/null -w '%{http_code}' -X "$1" "http://127.0.0.1:3310$2"
          }
          not_500() {
            local code
            code=$(code_of "$1" "$2")
            echo "$1 $2 $code"
            test "$code" != "500"
          }
          expect() {
            local code
            code=$(code_of "$1" "$2")
            echo "$1 $2 $code (want $3)"
            test "$code" = "$3"
          }
          not_500 GET /
          not_500 GET /login
          not_500 GET /privacy-policy
          not_500 GET /terms-of-service
          not_500 GET /data-deletion
          expect GET /api/health 200
          expect GET /api/wordpress/plugin 401
          expect GET /api/wordpress/install-note 401
          expect GET /api/ads/connect 401
          expect POST /api/ads/checks 401
          expect POST /api/ads/sync 401
          expect POST /api/ads/m51 401
          expect POST /api/approve 401
          expect POST /api/ads/decide 401
          expect GET /api/gsc/oauth/start 401
          expect GET /api/ads/clients 401
          not_500 GET /settings
          not_500 GET /api/ads/pixel
          not_500 GET /api/gsc/oauth/callback
          not_500 POST /api/login
          not_500 OPTIONS /api/ads/collect
          not_500 GET /api/ads/collect
      - name: Skip (no Brain / SEO changes)
        if: needs.changes.outputs.brain != 'true'
        run: echo "Skipped — apps/ads-only change. Brain + jobs/seo stay independently green."

  ads:
    name: apps/ads
    needs: changes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tharros
          POSTGRES_PASSWORD: tharros
          POSTGRES_DB: tharros
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U tharros -d tharros"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Check migration journal order
        if: needs.changes.outputs.ads == 'true'
        run: |
          git fetch --no-tags --depth=1 origin main
          node apps/ads/shared/scripts/check-migration-journal.mjs
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.ads == 'true'
        with:
          node-version: "22"
          cache: npm
      - name: Install
        if: needs.changes.outputs.ads == 'true'
        run: npm ci
      - name: Typecheck ads module + paid jobs
        if: needs.changes.outputs.ads == 'true'
        run: |
          npm run typecheck --workspace=@tharros/ads-shared
          npm run typecheck --workspace=@tharros/ads-api
          npm run typecheck --workspace=@tharros/ads-workers
          npm run typecheck --workspace=@cerevex/jobs-ads-shared
          npm run typecheck --workspace=@cerevex/jobs-ads-meta
          npm run typecheck --workspace=@cerevex/jobs-ads-google
          npm run typecheck --workspace=@cerevex/jobs-meta-ads
          npm run typecheck --workspace=@cerevex/jobs-google-ads
          npm run smoke:ids --workspace=@tharros/ads-workers
          npm run typecheck --workspace=@cerevex/contracts
          npm run typecheck --workspace=@tharros/ads-web
      - name: Migrate + seed + test ads module (schema os only)
        if: needs.changes.outputs.ads == 'true'
        env:
          DATABASE_URL: postgres://tharros:tharros@127.0.0.1:54329/tharros?options=-csearch_path%3Dos
          JWT_SECRET: ci-jwt-secret-not-for-prod
          TOKEN_ENCRYPTION_KEY: local-dev-only-token-key-32b!!
          SEED_OWNER_EMAIL: adam@tharrosmedia.com
          SEED_OWNER_PASSWORD: local-dev-only
          NODE_ENV: test
          OS_PROD_MIGRATE_ALLOW_INSECURE_LOOPBACK: "1"
        run: |
          npm run ads:db:migrate
          npm run ads:db:seed
          npm run test --workspace=@tharros/ads-api
      - name: Skip (no apps/ads / paid-job changes)
        if: needs.changes.outputs.ads != 'true'
        run: echo "Skipped — no apps/ads or paid-job changes. Brain + jobs/seo stay independently green."

  ads-web:
    name: apps/ads web build
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Build ads web
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:43180
          NEXT_PUBLIC_CONSOLE_ORIGIN: http://127.0.0.1:3000
        run: npm run build --workspace=@tharros/ads-web
