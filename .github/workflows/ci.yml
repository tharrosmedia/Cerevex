name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  changes:
    name: path filter
    runs-on: ubuntu-latest
    outputs:
      brain: ${{ steps.filter.outputs.brain }}
      ads: ${{ steps.filter.outputs.ads }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            brain:
              - 'apps/brain/**'
              - 'jobs/seo/**'
              - 'packages/contracts/**'
              - 'packages/db/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            ads:
              - 'apps/ads/**'
              - 'jobs/meta/**'
              - 'jobs/google/**'
              - 'packages/contracts/**'

  brain:
    name: apps/brain + jobs/seo
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.brain == 'true'
        with:
          node-version: "22"
          cache: npm
      - name: Install
        if: needs.changes.outputs.brain == 'true'
        run: npm ci
      - name: Typecheck Brain
        if: needs.changes.outputs.brain == 'true'
        run: npm run typecheck --workspace=@cerevex/brain
      - name: Typecheck jobs/seo
        if: needs.changes.outputs.brain == 'true'
        run: npm run typecheck --workspace=@cerevex/jobs-seo
      - name: Typecheck contracts
        if: needs.changes.outputs.brain == 'true'
        run: npm run typecheck --workspace=@cerevex/contracts
      - name: Test Brain
        if: needs.changes.outputs.brain == 'true'
        run: npm run test --workspace=@cerevex/brain
      - name: Skip (no Brain / SEO changes)
        if: needs.changes.outputs.brain != 'true'
        run: echo "Skipped — apps/ads-only change. Brain + jobs/seo stay independently green."

  ads:
    name: apps/ads
    needs: changes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tharros
          POSTGRES_PASSWORD: tharros
          POSTGRES_DB: tharros
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U tharros -d tharros"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.ads == 'true'
        with:
          node-version: "22"
          cache: npm
      - name: Install
        if: needs.changes.outputs.ads == 'true'
        run: npm ci
      - name: Typecheck ads module + paid jobs
        if: needs.changes.outputs.ads == 'true'
        run: |
          npm run typecheck --workspace=@tharros/ads-shared
          npm run typecheck --workspace=@tharros/ads-api
          npm run typecheck --workspace=@tharros/ads-workers
          npm run typecheck --workspace=@cerevex/jobs-meta-ads
          npm run typecheck --workspace=@cerevex/jobs-google-ads
          npm run typecheck --workspace=@cerevex/contracts
          npm run typecheck --workspace=@tharros/ads-web
      - name: Migrate + seed + test ads module (schema os only)
        if: needs.changes.outputs.ads == 'true'
        env:
          DATABASE_URL: postgres://tharros:tharros@127.0.0.1:54329/tharros?options=-csearch_path%3Dos
          JWT_SECRET: ci-jwt-secret-not-for-prod
          TOKEN_ENCRYPTION_KEY: local-dev-only-token-key-32b!!
          SEED_OWNER_EMAIL: adam@tharrosmedia.com
          SEED_OWNER_PASSWORD: local-dev-only
          NODE_ENV: test
        run: |
          npm run ads:db:migrate
          npm run ads:db:seed
          npm run test --workspace=@tharros/ads-api
      - name: Skip (no apps/ads / paid-job changes)
        if: needs.changes.outputs.ads != 'true'
        run: echo "Skipped — no apps/ads or paid-job changes. Brain + jobs/seo stay independently green."
